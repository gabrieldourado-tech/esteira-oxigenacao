name: Atualizar painel da Daily (Nutrição)

# O GitHub atrasa e às vezes pula horários agendados, então o robô "acorda" a cada 10 minutos.
# Das 7h às 12h (Fortaleza), em dia útil, ele puxa o ClickUp toda vez (cobre a daily das 9h às 10h30).
# No resto do tempo só puxa se a última atualização tiver 25 minutos ou mais.
on:
  schedule:
    - cron: '2,12,22,32,42,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-daily
  cancel-in-progress: false

jobs:
  sync-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Ver se já está na hora
        id: hora
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "rodar=sim" >> "$GITHUB_OUTPUT"; exit 0; fi
          node -e "
            let ult = 0; try { ult = Date.parse(require('./daily/data.json').sincronizado_em) || 0; } catch (e) {}
            const m = (Date.now() - ult) / 6e4;
            const f = new Date(Date.now() - 3 * 3600e3);
            const daily = f.getUTCDay() >= 1 && f.getUTCDay() <= 5 && f.getUTCHours() >= 7 && f.getUTCHours() < 12;
            console.log('minutos desde a ultima atualizacao:', Math.round(m), '| horario da daily:', daily);
            require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'rodar=' + ((daily || m >= 25) ? 'sim' : 'nao') + '\n');
          "
      - name: Puxar subtarefas de Copy e Edição
        if: steps.hora.outputs.rodar == 'sim'
        run: node daily/sync-daily.js
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
      - name: Salvar dados
        if: steps.hora.outputs.rodar == 'sim'
        run: |
          git add daily/data.json
          if git diff --cached --quiet; then echo "Sem mudanças"; exit 0; fi
          git config user.name "esteira-bot"
          git config user.email "esteira-bot@users.noreply.github.com"
          git commit -m "Atualiza dados da Daily"
          for i in 1 2 3 4; do git pull --rebase -X theirs && git push && exit 0; sleep 7; done
          exit 1
