name: Torre de Controle ao vivo (1 em 1 minuto)

# O robô fica ligado das 6h à meia-noite (Fortaleza) relendo o ClickUp a cada minuto
# e publicando no branch "dados-torre". O GitHub encerra cada turno em 6h; no fim ele se religa.
# O agendamento de hora em hora é só uma rede de segurança caso ele pare.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: torre-ao-vivo
  cancel-in-progress: false

jobs:
  ao-vivo:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Robô ao vivo
        run: node torre/live-torre.js
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
          TORRE_OUT: /tmp/torre-data.json
          DURACAO_MIN: '340'
      - name: Religar o robô para o próximo turno
        if: always()
        run: |
          H=$(TZ=America/Fortaleza date +%-H)
          if [ "$H" -ge 6 ]; then gh workflow run torre-ao-vivo.yml --ref main; else echo "Fora do horário, o agendamento religa às 6h"; fi
        env:
          GH_TOKEN: ${{ github.token }}
