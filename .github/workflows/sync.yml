name: Atualizar dados do ClickUp

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-esteira
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Puxar tasks da esteira
        run: node sync.js
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
      - name: Salvar dados
        run: |
          git add data.json
          if git diff --cached --quiet; then echo "Sem mudanças"; exit 0; fi
          git config user.name "esteira-bot"
          git config user.email "esteira-bot@users.noreply.github.com"
          git commit -m "Atualiza dados da esteira"
          for i in 1 2 3 4; do git pull --rebase -X theirs && git push && exit 0; sleep 7; done
          exit 1
